name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tipos, testes e cobertura
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      # Testes da fila de webhooks com BullMQ num Redis de verdade.
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Falha se a cobertura do backend e das rotas /api cair abaixo do piso em vitest.config.mts.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  postgres:
    name: Testes com PostgreSQL e Redis (docker/compose.yaml)
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Cada arquivo de teste cria e apaga o próprio banco (tests/support/test-database.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      # As mesmas dependências da etapa de testes: se o compose quebrar, o CI quebra junto.
      - name: Sobe PostgreSQL e Redis
        run: docker compose -f docker/compose.yaml up -d --wait
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrações no banco do compose
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vision_omie
      - run: npx vitest run tests
      - name: Logs das dependências
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color

  e2e:
    name: Build e telas (Playwright)
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Navegador em cache entre execuções; as dependências do sistema (apt) às vezes demoram: até 2 tentativas.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instala o Chromium do Playwright
        run: |
          for i in 1 2; do
            timeout 8m npx playwright install --with-deps chromium && exit 0
            echo "Tentativa $i falhou; tentando de novo."
          done
          exit 1
        timeout-minutes: 18
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Imagem Docker (aplicação e worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Variáveis da aplicação (só para este teste)
        run: |
          cat > docker/app.env <<VARS
          APP_ENCRYPTION_KEY=$(openssl rand -base64 32)
          AUTH_ADMIN_EMAIL=admin@ci.test
          AUTH_ADMIN_PASSWORD=girassol-azul-2026
          AUTH_API_TOKEN=token-ci-com-mais-de-trinta-e-dois-caracteres
          OMIE_WEBHOOK_TOKEN=token-ci
          SCHEDULER_ENABLED=false
          VARS
      - name: Constrói a imagem
        run: |
          set -o pipefail
          docker compose -f docker/compose.yaml --profile app build --progress plain 2>&1 | tee build.log
        timeout-minutes: 20
      - name: Sobe PostgreSQL, Redis, aplicação e worker
        run: docker compose -f docker/compose.yaml --profile app up -d --wait
        timeout-minutes: 5
      - name: Aplicação, login, fila no worker e scripts da imagem
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:3000
          AUTH="authorization: Bearer token-ci-com-mais-de-trinta-e-dois-caracteres"
          curl -fsS $BASE/api/health | jq -e '.ok == true and .database == "postgres"'
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/orders)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/pedidos)" = 307
          curl -fsS -c cookies.txt -H 'content-type: application/json' -d '{"email":"admin@ci.test","password":"girassol-azul-2026"}' $BASE/api/auth/login | jq -e '.user.role == "ADMIN"'
          curl -fsS -b cookies.txt $BASE/api/orders | jq -e '.total == 0'
          # Webhook: o servidor web só enfileira; quem processa é o contêiner do worker.
          ID=$(curl -fsS -H 'content-type: application/json' -d '{"messageId":"ci-1","topic":"VendaProduto.Faturada","event":{"idPedido":1}}' "$BASE/api/webhooks/omie?token=token-ci" | jq -r '.eventId')
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS -H "$AUTH" "$BASE/api/webhooks/events" | jq -r --arg id "$ID" '.items[] | select(.id == $id) | .status')
            [ "$STATUS" = IGNORED ] && break
            sleep 1
          done
          test "$STATUS" = IGNORED
          curl -fsS -H "$AUTH" $BASE/api/webhooks/events | jq -e '.queue.mode == "redis" and .queue.available'
          docker compose -f docker/compose.yaml --profile app logs worker > worker.log
          grep -q "Worker da fila de webhooks iniciado" worker.log
          docker compose -f docker/compose.yaml --profile app exec -T -e NEW_USER_PASSWORD=jabuticaba-madura-9 app node dist/users-create.mjs --email ops@ci.test --name Ops --role OPERATOR
          docker compose -f docker/compose.yaml --profile app exec -T app node dist/migrate.mjs
          curl -fsS -H 'content-type: application/json' -d '{"email":"ops@ci.test","password":"jabuticaba-madura-9"}' $BASE/api/auth/login | jq -e '.user.role == "OPERATOR"'
          docker image ls vision-omie-integration:local --format 'Imagem: {{.Size}}'
      - name: Logs dos contêineres
        if: failure()
        run: |
          C="docker compose -f docker/compose.yaml --profile app"
          $C ps -a
          $C logs --no-color > compose.log 2>&1 || true
          cat compose.log
          # Resumo também nas anotações do job (dá para ler sem baixar o log completo).
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          [ -s build.log ] && echo "::error title=Build (final)::$(tail -n 40 build.log | esc)"
          echo "::error title=Contêineres::$($C ps -a --format '{{.Name}} {{.State}} {{.Status}}' | esc)"
          [ -s compose.log ] && echo "::error title=Logs (final)::$(grep -v '^\s*$' compose.log | tail -n 40 | esc)"
          true

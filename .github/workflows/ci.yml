name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tipos, testes e cobertura
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      # Testes da fila de webhooks com BullMQ num Redis de verdade.
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Falha se a cobertura do backend e das rotas /api cair abaixo do piso em vitest.config.mts.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  postgres:
    name: Testes com PostgreSQL e Redis (docker/compose.yaml)
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Cada arquivo de teste cria e apaga o próprio banco (tests/support/test-database.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      # As mesmas dependências da etapa de testes: se o compose quebrar, o CI quebra junto.
      - name: Sobe PostgreSQL e Redis
        run: docker compose -f docker/compose.yaml up -d --wait
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrações no banco do compose
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vision_omie
      - run: npx vitest run tests
      - name: Logs das dependências
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color

  e2e:
    name: Build e telas (Playwright)
    # Fixo em 24.04: o ubuntu-latest está migrando para o 26, ainda não suportado pelo Playwright 1.56.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

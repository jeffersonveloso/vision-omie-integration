# Dependências da integração para a etapa de testes (homologação) e para os testes automatizados.
#
#   npm run deps:up      # sobe e espera os dois serviços ficarem saudáveis
#   npm run deps:down    # para (os dados ficam nos volumes)
#   docker compose -f docker/compose.yaml down -v   # para e apaga os dados
#
# A aplicação inteira em contêineres (servidor web + worker da fila), perfil "app":
#   cp docker/app.env.example docker/app.env   # preencha
#   npm run app:up       # constrói a imagem e sobe PostgreSQL, Redis, aplicação e worker
#
# Na aplicação (.env.local):
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/vision_omie
#   REDIS_URL=redis://localhost:6379
#
# Usuário, senha, banco e portas podem mudar em docker/.env (modelo em docker/.env.example).
# As portas só abrem em 127.0.0.1: a aplicação roda na mesma máquina.

# Mesmo nome de projeto do antigo docker-compose.yml da raiz, para reaproveitar os volumes já criados.
name: vision-omie-integration

services:
  # Banco da aplicação: pedidos, mapeamentos, contas, logs, auditoria e eventos de webhook.
  # Os testes automatizados (TEST_DATABASE_URL) criam e apagam bancos próprios neste mesmo servidor.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision_omie}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Fila dos webhooks do Omie (BullMQ). AOF ligado para os jobs sobreviverem a reinício, e
  # noeviction porque o BullMQ não funciona direito se o Redis descartar chaves por falta de memória.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Perfil "app": a própria integração (docker/Dockerfile) ──────────────────────────────
  app:
    profiles: ["app"]
    build: &app-build
      context: ..
      dockerfile: docker/Dockerfile
    image: vision-omie-integration:local
    restart: unless-stopped
    env_file:
      - path: ./app.env
        required: false
    environment: &app-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vision_omie}
      REDIS_URL: redis://redis:6379
      # A fila é processada pelo serviço "worker" abaixo.
      WEBHOOK_WORKER_ENABLED: "false"
    depends_on: &app-depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Na frente, um proxy com HTTPS (Nginx, Caddy, Traefik) publica a aplicação; APP_BIND=0.0.0.0 abre direto.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  # Worker da fila dos webhooks do Omie (mesma imagem). Dá para subir mais de um: --scale worker=2.
  worker:
    profiles: ["app"]
    # Mesma imagem da aplicação (o segundo build sai do cache).
    build: *app-build
    image: vision-omie-integration:local
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    env_file:
      - path: ./app.env
        required: false
    environment: *app-environment
    depends_on:
      <<: *app-depends
      # A aplicação aplica as migrações ao iniciar; o worker espera por ela.
      app:
        condition: service_healthy
    # Saudável enquanto o worker grava o batimento (a cada 15 s, só se o Redis responde).
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('path').join(require('os').tmpdir(),'vision-omie-worker.heartbeat');process.exit(Date.now()-require('fs').statSync(f).mtimeMs<60000?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  redisdata:
